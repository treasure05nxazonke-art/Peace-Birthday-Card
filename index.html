<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Peace ❤️</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="wrapper">
        <div class="balloon-bg-container"></div> <!-- behind the card -->
        <div class="card" onclick="openCard()">

            <div class="flap"></div>

            <div class="message">
                <h1>Happy Birthday Peace 🎉</h1>
                <p>
                    May your day be filled with love,
                    laughter and beautiful surprises.
                    I'm grateful for your friendship.
                </p>
                <p class="signature">— Treasure 💙</p>
            </div>

            <div class="hearts"></div>

        </div>
    </div>
    <audio id="music">
        <source src="music/nastelbom-happy-birthday-469282.mp3" type="audio/mpeg">
    </audio>

    <script src="js/main.js"></script>

</body>

</html>
